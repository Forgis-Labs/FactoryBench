[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorybench"
version = "1.0.0"
description = "FactoryBench: a benchmark for machine understanding over industrial robotic telemetry"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "the authors" }]

# Everything the generation, evaluation and scoring pipelines under src/ need
# on the default path. Cloud SDKs and the finetuning stack are extras: neither
# is needed to build the dataset or to score an existing prediction file.
dependencies = [
    "huggingface-hub>=0.26",  # the release is read and written through HfApi
    "datasets>=4.0",          # not imported here; the README quick start's
                              # load_dataset path, kept so `pip install .`
                              # gives a reader what the README promises
    "openai>=2.0",            # code uses the 2.x client surface
    "requests>=2.32",
    "httpx>=0.27",            # src/scoring/batch.py drives the batch APIs
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
# Vertex AI inference path (src/evaluation/run_gcp_eval.py, scripts/gcp/*).
# google-auth supplies ADC, google-cloud-storage handles batch-prediction I/O.
# The Vertex calls are plain REST through `requests`, so the heavyweight
# google-cloud-aiplatform client is deliberately not a dependency.
gcp = [
    "google-auth>=2.35",
    "google-cloud-storage>=2.18",
]

# Retired Bedrock + SageMaker path (src/evaluation/run_aws_eval.py, reachable
# via FB_INFERENCE_CLOUD=aws) and the SageMaker launchers under finetuning/.
aws = [
    "boto3>=1.35",
    "sagemaker>=2.235,<3",
]

# DoRA finetuning and evaluation of the Shrike/BearingModel time-series LLM
# (finetuning/_factorybench_src/). Runs on the SageMaker training image;
# flash-attn is optional there and is probed at import time, not required.
finetune = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
]

dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
